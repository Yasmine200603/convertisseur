<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Convertisseur de devises</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #f2f2f2; }
        form { background: white; padding: 20px; border-radius: 10px; display: inline-block; }
        input, select, button { margin: 10px; padding: 10px; width: 220px; }
        #resultat { margin-top: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>
    <h2>Convertisseur de devises</h2>
    <form method="POST">
        <input type="number" name="montant" placeholder="Montant" required><br>
        <select name="source">
            <option value="EUR">Euro (EUR)</option>
            <option value="USD">Dollar (USD)</option>
            <option value="DZD">Dinar (DZD)</option>
        </select><br>
        <select name="cible">
            <option value="EUR">Euro (EUR)</option>
            <option value="USD">Dollar (USD)</option>
            <option value="DZD">Dinar (DZD)</option>
        </select><br>
        <button type="submit">Convertir</button>
    </form>

    {% if resultat %}
    <div id="resultat">{{ resultat }}</div>
    {% endif %}
</body>
</html>
